<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project quote calculator</title><link rel="stylesheet" href="../demo.css"></head><body><main class="wrap"><a class="back" href="../">← All demos</a><h1>Project quote calculator</h1><p class="sub">Sample rates only. Edit the RATES and EXTRAS values in this file to match your pricing.</p>
<div class="card"><label for="t">Project type</label><select id="t"></select><label for="p">Pages or screens: <b id="pv">5</b></label><input id="p" type="range" min="1" max="30" value="5"><div id="x"></div>
<div class="total" id="out"></div><a class="btn" id="wa" target="_blank" rel="noopener">Send this on WhatsApp</a></div></main>
<script>
const WA="91XXXXXXXXXX"; // replace with your WhatsApp number, country code first, no +
const RATES={"Website":15000,"Android app":60000,"AI assistant":80000,"Automation":25000},PAGE=2000,EXTRAS={"Admin panel":20000,"Online payments":10000,"AI chat":25000};
const t=document.getElementById("t"),p=document.getElementById("p"),x=document.getElementById("x");
Object.keys(RATES).forEach(k=>t.add(new Option(k)));
Object.keys(EXTRAS).forEach(k=>x.insertAdjacentHTML("beforeend",`<label class="chk"><input type="checkbox" value="${k}"> ${k}</label>`));
const f=n=>"₹"+n.toLocaleString("en-IN");
function calc(){const pages=+p.value,ex=[...x.querySelectorAll(":checked")].map(c=>c.value);
const base=RATES[t.value]+Math.max(0,pages-5)*PAGE+ex.reduce((s,k)=>s+EXTRAS[k],0);
document.getElementById("pv").textContent=pages;
document.getElementById("out").textContent=f(Math.round(base*.9/1000)*1000)+" – "+f(Math.round(base*1.2/1000)*1000);
document.getElementById("wa").href=`https://wa.me/${WA}?text=`+encodeURIComponent(`Hi Aureon, I need a ${t.value} (${pages} pages/screens)${ex.length?" with "+ex.join(", "):""}. Estimated ${document.getElementById("out").textContent}.`)}
document.querySelector(".card").addEventListener("input",calc);calc();
</script></body></html>
