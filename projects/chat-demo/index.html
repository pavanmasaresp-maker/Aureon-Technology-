<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aureon Assistant demo</title><link rel="stylesheet" href="../demo.css"></head><body><main class="wrap"><a class="back" href="../">← All demos</a><h1>Aureon Assistant</h1><p class="sub">Front-end demo with canned replies. Replace reply() with a fetch to your own AI API to make it live.</p>
<div class="chat" id="log" aria-live="polite"></div><form id="f" class="row"><input id="q" placeholder="Ask about services or timelines" autocomplete="off" required><button>Send</button></form></main>
<script>
const R=[[/price|cost|quote/,"Pricing depends on scope. Use the quote calculator, or message us on WhatsApp."],[/app|android/,"We build Android apps and the backend that powers them."],[/ai|bot|chat/,"We build AI assistants with chat, voice, vision and task automation."],[/time|long|week|deliver/,"A business website usually takes 1–2 weeks. Apps take longer."],[/hi|hello|hey/,"Hello! Ask me about our services, timelines or pricing."]];
const log=document.getElementById("log"),q=document.getElementById("q");
function add(t,u){const d=document.createElement("div");d.className="m"+(u?" u":"");d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight}
function reply(t){const r=R.find(x=>x[0].test(t.toLowerCase()));return r?r[1]:"I can help with services, pricing and timelines. Try one of those."}
add("Hi, I'm the Aureon Assistant. What would you like to build?");
document.getElementById("f").onsubmit=e=>{e.preventDefault();const t=q.value.trim();if(!t)return;add(t,1);q.value="";setTimeout(()=>add(reply(t)),400)};
</script></body></html>
