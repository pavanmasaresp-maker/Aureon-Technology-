<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task board</title><link rel="stylesheet" href="../demo.css"></head><body><main class="wrap" style="max-width:980px"><a class="back" href="../">← All demos</a><h1>Task board</h1><p class="sub">Tasks are saved in this browser only.</p>
<form id="f" class="row" style="margin-bottom:16px"><input id="q" placeholder="New task" required><button>Add task</button></form><div class="grid" id="g"></div></main>
<script>
const C=["To do","Doing","Done"];let T=[];
try{T=JSON.parse(localStorage.getItem("aureon-tasks")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("aureon-tasks",JSON.stringify(T))}catch(e){}};
function draw(){const g=document.getElementById("g");g.innerHTML="";C.forEach((c,i)=>{const col=document.createElement("div");col.className="card col";col.innerHTML=`<h3>${c}</h3>`;
T.forEach((k,j)=>{if(k.c!==i)return;const d=document.createElement("div");d.className="task";const s=document.createElement("span");s.textContent=k.t;d.append(s);const b=document.createElement("div");
const mk=(l,fn,a)=>{const e=document.createElement("button");e.textContent=l;e.setAttribute("aria-label",a);e.onclick=()=>{fn();save();draw()};b.append(e)};
if(i>0)mk("←",()=>k.c--,"Move left");if(i<2)mk("→",()=>k.c++,"Move right");mk("✕",()=>T.splice(j,1),"Delete task");d.append(b);col.append(d)});g.append(col)})}
document.getElementById("f").onsubmit=e=>{e.preventDefault();const q=document.getElementById("q");T.push({t:q.value.trim(),c:0});q.value="";save();draw()};draw();
</script></body></html>
